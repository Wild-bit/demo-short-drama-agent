name: short-drama-agent

services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    init: true
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      API_PROXY_TARGET: http://api:3000
      VITE_VIDEO_MODEL: ${ALIYUN_AI_VIDEO_MODEL:-wan3.0-video}
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web/src:/app/web/src
      - ./web/public:/app/web/public
      - ./web/index.html:/app/web/index.html:ro
      - ./web/vite.config.ts:/app/web/vite.config.ts:ro
      - ./src/domain:/app/src/domain:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
  api:
    build:
      context: .
      target: development
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3000"
    environment:
      NODE_ENV: development
      PORT: "3000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-short_drama}
      MYSQL_USER: ${MYSQL_USER:-short_drama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AGENT_CONTEXT_PROFILE: ${AGENT_CONTEXT_PROFILE:-}
      AGENT_CONTEXT_WINDOW_TOKENS: ${AGENT_CONTEXT_WINDOW_TOKENS:-}
      ASSET_CDN_ORIGIN: ${ASSET_CDN_ORIGIN:-}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_REGION: ${COS_REGION:-}
      COS_STS_SECRET_ID: ${COS_STS_SECRET_ID:-}
      COS_STS_SECRET_KEY: ${COS_STS_SECRET_KEY:-}
      ALIYUN_AI_API_KEY: ${ALIYUN_AI_API_KEY:-}
      ALIYUN_AI_REGION: ${ALIYUN_AI_REGION:-cn-beijing}
      ALIYUN_AI_WORKSPACE_ID: ${ALIYUN_AI_WORKSPACE_ID:-}
      ALIYUN_AI_BASE_URL: ${ALIYUN_AI_BASE_URL:-https://maas.qianwenaiapi.com/api/v1}
      ALIYUN_AI_IMAGE_MODEL: ${ALIYUN_AI_IMAGE_MODEL:-wan2.7-image}
      ALIYUN_AI_KLING_IMAGE_MODEL: ${ALIYUN_AI_KLING_IMAGE_MODEL:-kling/kling-v3-omni-image-generation}
      ALIYUN_AI_VIDEO_MODEL: ${ALIYUN_AI_VIDEO_MODEL:-wan3.0-video}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.build.json:/app/tsconfig.build.json:ro
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health/database', { signal: AbortSignal.timeout(3000) }).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-short_drama}
      MYSQL_USER: ${MYSQL_USER:-short_drama}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?请在 .env 中设置 MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
