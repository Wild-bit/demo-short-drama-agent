<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>短剧工坊 · 全量函数调用关系与渲染流程图</title>
  <style>
    :root {
      --bg: #090b10;
      --bg-panel: #10141e;
      --bg-card: #151b28;
      --bg-hover: #1c2436;
      --line: rgba(255, 255, 255, 0.09);
      --line-strong: rgba(255, 255, 255, 0.18);
      --text: #eef2fa;
      --text-sec: #b5bfd1;
      --muted: #7e899f;
      --amber: #eab044;
      --amber-soft: rgba(234, 176, 68, 0.14);
      --cyan: #38bdf8;
      --blue: #60a5fa;
      --purple: #a78bfa;
      --pink: #f472b6;
      --orange: #fb923c;
      --green: #34d399;
      --yellow: #facc15;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 24px;
      background: rgba(11, 14, 22, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
    }
    .brand h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }
    .brand small {
      color: var(--muted);
      font-size: 12px;
      margin-left: 8px;
    }
    .stats {
      display: flex;
      gap: 18px;
      align-items: center;
      font-size: 12px;
      color: var(--text-sec);
    }
    .stats b {
      color: var(--amber);
      font-family: var(--mono);
      font-size: 13px;
    }

    .page {
      max-width: 1680px;
      margin: 0 auto;
      padding: 18px 24px 56px;
      display: grid;
      gap: 22px;
    }

    /* Scenario Tabs */
    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    .tab-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-panel);
      color: var(--text-sec);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 550;
      cursor: pointer;
      transition: all 0.16s ease;
    }
    .tab-btn:hover {
      border-color: var(--line-strong);
      color: var(--text);
      background: var(--bg-hover);
    }
    .tab-btn.active {
      background: var(--amber-soft);
      border-color: rgba(234, 176, 68, 0.6);
      color: #f9cc74;
    }

    /* Diagram Stage */
    .stage-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 14px;
      min-height: 620px;
    }
    .stage-wrap.is-expanded {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: var(--bg);
      padding: 14px;
      min-height: 100vh;
    }
    @media (max-width: 1120px) {
      .stage-wrap {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .canvas-box {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      background:
        radial-gradient(rgba(255, 255, 255, 0.055) 1px, transparent 1px),
        #0b0e15;
      background-size: 22px 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 580px;
    }
    .canvas-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 14px;
      background: rgba(16, 20, 30, 0.88);
      border-bottom: 1px solid var(--line);
      font-size: 12.5px;
      color: var(--text-sec);
      flex-wrap: wrap;
    }
    .canvas-tools {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .tool-btn {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--bg-card);
      color: var(--text);
      border-radius: 7px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }
    .tool-btn:hover {
      border-color: var(--amber);
      color: #f9cc74;
    }
    .zoom-readout {
      font-family: var(--mono);
      font-size: 11.5px;
      min-width: 46px;
      text-align: center;
      color: var(--muted);
    }

    .svg-viewport {
      flex: 1;
      width: 100%;
      height: 100%;
      cursor: grab;
      user-select: none;
      overflow: hidden;
    }
    .svg-viewport.dragging {
      cursor: grabbing;
    }

    .legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 7px 12px;
      border-radius: 9px;
      background: rgba(13, 17, 26, 0.9);
      border: 1px solid var(--line);
      font-size: 11.5px;
      color: var(--text-sec);
      pointer-events: none;
    }
    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .legend i {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      display: inline-block;
    }

    /* Inspector Panel */
    .inspector {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg-panel);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .inspector-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      font-size: 11.5px;
      padding: 3px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-sec);
    }
    .inspector h3 {
      margin: 0;
      font-family: var(--mono);
      font-size: 15px;
      color: #f9cc74;
      word-break: break-word;
    }
    .inspector-path {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      padding: 7px 10px;
      background: #0a0d14;
      border: 1px solid var(--line);
      border-radius: 8px;
      word-break: break-all;
    }
    .inspector-desc {
      margin: 0;
      font-size: 13.5px;
      line-height: 1.68;
      color: var(--text);
    }
    .rel-box {
      border-top: 1px solid var(--line);
      padding-top: 12px;
      display: grid;
      gap: 8px;
      font-size: 12.5px;
    }
    .rel-box strong {
      color: var(--text-sec);
      display: block;
      margin-bottom: 4px;
    }
    .pill-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .code-pill {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 2px 7px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.055);
      border: 1px solid var(--line);
      color: var(--text-sec);
    }
    .open-btn {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      background: var(--amber);
      color: #141008;
      font-weight: 650;
      font-size: 13px;
      padding: 9px 14px;
      border-radius: 9px;
      transition: filter 0.15s;
    }
    .open-btn:hover {
      filter: brightness(1.08);
    }

    /* Dictionary Section */
    .dict-section {
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--bg-panel);
      padding: 18px;
      display: grid;
      gap: 14px;
    }
    .dict-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .dict-head h2 {
      margin: 0;
      font-size: 16px;
    }
    .search-input {
      width: min(360px, 100%);
      background: #0a0d14;
      border: 1px solid var(--line-strong);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 9px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--amber);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }
    th {
      background: #141926;
      color: var(--text-sec);
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      line-height: 1.55;
    }
    tr:hover td {
      background: rgba(255, 255, 255, 0.025);
    }
    .fn-name {
      font-family: var(--mono);
      color: #f8cd73;
      font-weight: 600;
      font-size: 12px;
      display: block;
    }
    .fn-file {
      font-family: var(--mono);
      color: var(--muted);
      font-size: 11px;
    }
    .mod-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      white-space: nowrap;
    }
    .mod-badge i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      display: inline-block;
    }
    .jump-link {
      display: inline-block;
      text-decoration: none;
      color: var(--amber);
      border: 1px solid rgba(234, 176, 68, 0.4);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      white-space: nowrap;
    }
    .jump-link:hover {
      background: var(--amber-soft);
    }

    /* SVG Node Hover */
    .dag-node {
      cursor: pointer;
    }
    .dag-node:hover rect.node-box {
      stroke: #eab044;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <h1>短剧工坊 · 全量函数调用关系与浏览器渲染流程图</h1>
      <small>离线单文件版（支持滚轮缩放 / 拖拽画布 / 点击节点查看上下游并唤起 Cursor 定位源码）</small>
    </div>
    <div class="stats">
      <span>核心流程图 <b id="stat-flows">7</b> 张</span>
      <span>模块分层 <b>7</b> 层</span>
      <span>收录函数条目 <b id="stat-fns">0</b> 组（覆盖全工程 130+ 函数）</span>
    </div>
  </header>

  <main class="page">
    <nav class="tabs-bar" id="scenario-tabs" aria-label="流程图切换"></nav>

    <section class="stage-wrap" id="stage-wrap">
      <div class="canvas-box">
        <div class="canvas-head">
          <span id="scenario-summary"></span>
          <div class="canvas-tools">
            <button type="button" class="tool-btn" id="btn-zoom-out">－</button>
            <span class="zoom-readout" id="zoom-label">100%</span>
            <button type="button" class="tool-btn" id="btn-zoom-in">＋</button>
            <button type="button" class="tool-btn" id="btn-fit">适配窗口</button>
            <button type="button" class="tool-btn" id="btn-expand">全屏画布</button>
          </div>
        </div>

        <svg class="svg-viewport" id="dag-svg" role="img" aria-label="函数调用关系流程图">
          <defs>
            <marker id="arrow-def" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#5e6b85" />
            </marker>
            <marker id="arrow-hi" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#eab044" />
            </marker>
            <marker id="arrow-loop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
              <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#a78bfa" />
            </marker>
          </defs>
          <g id="dag-viewport"></g>
        </svg>

        <div class="legend" id="legend-bar"></div>
      </div>

      <aside class="inspector" id="inspector">
        <div class="inspector-tag" id="insp-group"></div>
        <h3 id="insp-title">点击左侧节点查看详情</h3>
        <div class="inspector-path" id="insp-path"></div>
        <p class="inspector-desc" id="insp-desc"></p>
        <div class="rel-box">
          <div>
            <strong>上游调用方（谁调用它）</strong>
            <div class="pill-list" id="insp-in"></div>
          </div>
          <div>
            <strong>下游被调方（它调用谁）</strong>
            <div class="pill-list" id="insp-out"></div>
          </div>
        </div>
        <a class="open-btn" id="insp-open" href="#">在 Cursor 中打开源码行</a>
      </aside>
    </section>

    <section class="dict-section">
      <div class="dict-head">
        <h2>全工程函数与方法调用字典（前后端 100% 覆盖）</h2>
        <input type="search" class="search-input" id="dict-search" placeholder="搜索函数名、文件名、HTTP 路径（如 /sessions/stream）或课程号…" />
      </div>
      <div class="tabs-bar" id="group-tabs"></div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>模块</th>
              <th>函数 / 方法签名 & 文件位置</th>
              <th>课程</th>
              <th>核心职责与数据流说明</th>
              <th>上游调用方 → 下游被调方</th>
              <th>跳转</th>
            </tr>
          </thead>
          <tbody id="dict-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const WORKSPACE_ROOT = "/Users/laizhenhang/Desktop/code/demo-short-drama-agent";

    const GROUPS = {
      web: { label: "Web 前端工作台", color: "#38bdf8" },
      auth: { label: "认证与身份守卫", color: "#facc15" },
      session: { label: "会话、SSE 与运行轨迹", color: "#60a5fa" },
      agent: { label: "Agent Loop、上下文与工具", color: "#a78bfa" },
      gateway: { label: "DeepSeek 网关与基础设施", color: "#f472b6" },
      projects: { label: "项目、分镜与确认", color: "#fb923c" },
      assets: { label: "素材库与腾讯云 COS", color: "#34d399" }
    };

    const SCENARIOS = [
      {
        id: "overview-arch",
        title: "0. 全站七层总览架构图",
        direction: "TB",
        summary: "从浏览器挂载入口到 NestJS 控制器、Harness 编排器、工具系统、MySQL 事务与外部 DeepSeek / COS 的全局调用拓扑。",
        nodes: [
          { id: "n_web_boot", label: "main.tsx -> App()", sub: "web/src/App.tsx", line: 28, group: "web", detail: "浏览器入口：readAuth 校验本地 Token，route() 解析 '/' 与 '/projects/:id'，分发 LoginPage / ProjectList / Workspace。" },
          { id: "n_web_ws", label: "Workspace + Editor + Confirmation", sub: "web/src/components/Workspace.tsx", line: 51, group: "web", detail: "三段式导播台：四路并发拉取项目/最新分镜/会话列表/确认记录，管理草稿编辑、乐观锁保存、采用建议弹窗与生成前确认。" },
          { id: "n_web_chat", label: "Chat + Thread + ChatUiBlocks", sub: "web/src/components/Chat.tsx", line: 67, group: "web", detail: "即梦式会话侧栏 + 多会话 hidden 保活消息流 + A2UI 受控素材画廊组件 ChatAssetGallery。" },
          { id: "n_web_api", label: "api() / uploadAsset() / streamTurn()", sub: "web/src/api.ts", line: 14, group: "web", detail: "前端统一请求层：注入 Bearer Token、401 过期广播、FormData 上传与 SSE 分块流式解析。" },
          { id: "n_guard", label: "AuthGuard + @CurrentUserId", sub: "src/auth/auth.guard.ts", line: 8, group: "auth", detail: "拦截全部受保护路由，AuthService.authenticate 校验 SHA-256 Token 哈希并注入可信 userId。" },
          { id: "n_c_proj", label: "Projects & Storyboards Controllers", sub: "src/projects/storyboards.controller.ts", line: 10, group: "projects", detail: "承载 /api/projects/* 与 /api/storyboards/* 全部零路径参数 GET/POST 接口。" },
          { id: "n_c_sess", label: "Session & Agent Controllers", sub: "src/harness/session/session.controller.ts", line: 24, group: "session", detail: "承载 /api/sessions/*（list/create/rename/pin/delete/messages/run/stream/turn）与 /api/agent/run-once。" },
          { id: "n_c_asset", label: "AssetsController", sub: "src/assets/assets.controller.ts", line: 24, group: "assets", detail: "承载 GET /assets/search、GET /assets/detail 与 POST /assets/upload。" },
          { id: "n_s_svc", label: "SessionService + ActiveSessions + RunTrace", sub: "src/harness/session/session.service.ts", line: 85, group: "session", detail: "管理会话互斥运行锁、选镜准备、RunTrace 轨迹计量、expectedLastSequence 乐观锁消息追加与首句自动命名。" },
          { id: "n_p_svc", label: "ProjectsService + StoryboardsService", sub: "src/projects/storyboards.service.ts", line: 28, group: "projects", detail: "管理项目归属排他锁、expectedVersion 分镜快照保存、confirmationId 幂等确认及项目级联事务删除。" },
          { id: "n_agent", label: "AgentService + context + compaction", sub: "src/harness/agent/agent.service.ts", line: 58, group: "agent", detail: "ReAct 四步主循环（prepareTurnInput -> callModel -> appendAssistantTurn -> runToolBatch）：预算裁剪、按需摘要、5 次工具上限与卡片推送。" },
          { id: "n_tools", label: "ToolRegistry + Search / Propose / Recall", sub: "src/tools/tool-registry.service.ts", line: 6, group: "agent", detail: "派发 search_user_assets、propose_storyboard（项目会话专属）与 read_session_history（归档原话回查）。" },
          { id: "n_as_svc", label: "AssetsService + CosStorage + CosSts", sub: "src/assets/assets.service.ts", line: 39, group: "assets", detail: "魔数格式校验、STS 最小权限临时凭证缓存、COS 分块上传与 MySQL 资产登记补偿。" },
          { id: "n_gw", label: "generateDeepSeekText + readDeepSeekStream", sub: "src/gateway/text/deepseek.ts", line: 90, group: "gateway", detail: "转换消息与工具声明（过滤空 toolCalls），通过 httpClient 调 DeepSeek 流式/非流式接口并汇总 Token 用量。" }
        ],
        edges: [
          { from: "n_web_boot", to: "n_web_ws" },
          { from: "n_web_boot", to: "n_web_chat" },
          { from: "n_web_ws", to: "n_web_api" },
          { from: "n_web_chat", to: "n_web_api" },
          { from: "n_web_api", to: "n_guard", note: "Vite /api 同源代理" },
          { from: "n_guard", to: "n_c_proj" },
          { from: "n_guard", to: "n_c_sess" },
          { from: "n_guard", to: "n_c_asset" },
          { from: "n_c_proj", to: "n_p_svc" },
          { from: "n_c_sess", to: "n_s_svc" },
          { from: "n_c_asset", to: "n_as_svc" },
          { from: "n_s_svc", to: "n_p_svc", note: "归属与选镜校验" },
          { from: "n_s_svc", to: "n_agent" },
          { from: "n_agent", to: "n_tools" },
          { from: "n_agent", to: "n_gw" },
          { from: "n_tools", to: "n_as_svc", note: "searchAssets" }
        ]
      },
      {
        id: "browser-render-pipeline",
        title: "1. 浏览器前端渲染与 SSE 上屏路径",
        direction: "TB",
        summary: "访问 http://127.0.0.1:5173 后，从 index.html 挂载、路由判断、四路并发初始化，到 SSE 字节流逐帧驱动 React DOM 局部重绘的完整前端路径。",
        nodes: [

    function layoutDAG(scenario) {
      const NODE_W = 264;
      const NODE_H = 62;
      const RANK_GAP = 64;
      const NODE_GAP = 34;
      const PAD = 44;

      const ids = scenario.nodes.map(n => n.id);
      const forwardEdges = scenario.edges.filter(e => !e.isLoop);
      const ranks = new Map(ids.map(id => [id, 0]));

      for (let pass = 0; pass < ids.length; pass++) {
        for (const e of forwardEdges) {
          const rFrom = ranks.get(e.from) || 0;
          const rTo = ranks.get(e.to) || 0;
          if (rTo <= rFrom) ranks.set(e.to, rFrom + 1);
        }
      }

      const layers = new Map();
      for (const n of scenario.nodes) {
        const r = ranks.get(n.id) || 0;
        if (!layers.has(r)) layers.set(r, []);
        layers.get(r).push(n);
      }

      const maxCols = Math.max(...Array.from(layers.values()).map(arr => arr.length));
      const totalW = Math.max(920, maxCols * NODE_W + (maxCols - 1) * NODE_GAP + PAD * 2 + 110);
      const maxRank = Math.max(...Array.from(layers.keys()));
      const totalH = (maxRank + 1) * NODE_H + maxRank * RANK_GAP + PAD * 2;

      const positions = new Map();
      for (const [r, arr] of layers.entries()) {
        const rowW = arr.length * NODE_W + (arr.length - 1) * NODE_GAP;
        const startX = (totalW - 70 - rowW) / 2;
        const y = PAD + r * (NODE_H + RANK_GAP);
        arr.forEach((node, idx) => {
          positions.set(node.id, {
            x: startX + idx * (NODE_W + NODE_GAP),
            y,
            w: NODE_W,
            h: NODE_H
          });
        });
      }

      return { positions, totalW, totalH, NODE_W, NODE_H };
    }

    // ===================== 状态与交互渲染 =====================
    let currentScenario = SCENARIOS[0];
    let selectedNodeId = currentScenario.nodes[0].id;
    let zoom = 1;
    let panX = 0;
    let panY = 0;
    let currentGroupFilter = "all";

    const svgEl = document.getElementById("dag-svg");
    const viewportG = document.getElementById("dag-viewport");

    function cursorLink(file, line) {
      return `cursor://file${WORKSPACE_ROOT}/${file}:${line}:1`;
    }

    function applyTransform() {
      viewportG.setAttribute("transform", `translate(${panX}, ${panY}) scale(${zoom})`);
      document.getElementById("zoom-label").textContent = Math.round(zoom * 100) + "%";
    }

    function fitToViewport(layout) {
      const rect = svgEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const scaleX = (rect.width - 36) / layout.totalW;
      const scaleY = (rect.height - 36) / layout.totalH;
      zoom = Math.max(0.45, Math.min(1.15, Math.min(scaleX, scaleY)));
      panX = (rect.width - layout.totalW * zoom) / 2;
      panY = Math.max(14, (rect.height - layout.totalH * zoom) / 2);
      applyTransform();
    }

    function updateInspector() {
      const node = currentScenario.nodes.find(n => n.id === selectedNodeId) || currentScenario.nodes[0];
      if (!node) return;
      const gMeta = GROUPS[node.group];
      const tagEl = document.getElementById("insp-group");
      tagEl.innerHTML = `<i style="width:8px;height:8px;border-radius:50%;background:${gMeta.color};display:inline-block"></i> ${gMeta.label}`;
      document.getElementById("insp-title").textContent = node.label;
      document.getElementById("insp-path").textContent = `${node.sub}:${node.line}`;
      document.getElementById("insp-desc").textContent = node.detail;

      const incoming = currentScenario.edges
        .filter(e => e.to === node.id)
        .map(e => currentScenario.nodes.find(n => n.id === e.from)?.label || e.from);
      const outgoing = currentScenario.edges
        .filter(e => e.from === node.id)
        .map(e => currentScenario.nodes.find(n => n.id === e.to)?.label || e.to);

      document.getElementById("insp-in").innerHTML = incoming.length
        ? incoming.map(t => `<span class="code-pill">${t}</span>`).join("")
        : `<span class="code-pill">顶层触发入口</span>`;
      document.getElementById("insp-out").innerHTML = outgoing.length
        ? outgoing.map(t => `<span class="code-pill">${t}</span>`).join("")
        : `<span class="code-pill">链路终点 / 落库响应</span>`;

      document.getElementById("insp-open").href = cursorLink(node.sub, node.line);
    }

    function renderScenario(shouldFit = false) {
      document.getElementById("scenario-summary").textContent = currentScenario.summary;
      const layout = layoutDAG(currentScenario);
      const { positions, NODE_W, NODE_H } = layout;

      let html = "";

      // Edges
      for (const edge of currentScenario.edges) {
        const src = positions.get(edge.from);
        const tgt = positions.get(edge.to);
        if (!src || !tgt) continue;
        const isActive = edge.from === selectedNodeId || edge.to === selectedNodeId;

        let d = "";
        let lx = 0;
        let ly = 0;
        let anchor = "start";

        if (edge.isLoop) {
          const sx = src.x + NODE_W;
          const sy = src.y + NODE_H / 2;
          const tx = tgt.x + NODE_W;
          const ty = tgt.y + NODE_H / 2;
          const rightX = Math.max(sx, tx) + 76;
          d = `M ${sx} ${sy} C ${rightX} ${sy}, ${rightX} ${ty}, ${tx} ${ty}`;
          lx = rightX - 8;
          ly = (sy + ty) / 2;
          anchor = "end";
        } else {
          const sx = src.x + NODE_W / 2;
          const sy = src.y + NODE_H;
          const tx = tgt.x + NODE_W / 2;
          const ty = tgt.y;
          const midY = (sy + ty) / 2;
          d = `M ${sx} ${sy} C ${sx} ${midY}, ${tx} ${midY}, ${tx} ${ty}`;
          lx = (sx + tx) / 2 + 8;
          ly = midY - 4;
        }

        const stroke = edge.isLoop ? "#a78bfa" : (isActive ? "#eab044" : "#4b566e");
        const marker = edge.isLoop ? "url(#arrow-loop)" : (isActive ? "url(#arrow-hi)" : "url(#arrow-def)");
        const dash = edge.isLoop ? `stroke-dasharray="6 4"` : "";
        const width = isActive || edge.isLoop ? "2" : "1.35";

        html += `<g>
          <path d="${d}" fill="none" stroke="${stroke}" stroke-width="${width}" ${dash} marker-end="${marker}" />
          ${edge.note ? `<text x="${lx}" y="${ly}" fill="${edge.isLoop ? '#c4b5fd' : '#9aa6bd'}" font-size="11" text-anchor="${anchor}">${edge.note}</text>` : ""}
        </g>`;
      }

      // Nodes
      for (const node of currentScenario.nodes) {
        const pos = positions.get(node.id);
        const color = GROUPS[node.group].color;
        const active = node.id === selectedNodeId;
        const title = node.label.length > 31 ? node.label.slice(0, 30) + "…" : node.label;
        const sub = `${node.sub}:${node.line}`;
        const subShort = sub.length > 38 ? "…" + sub.slice(-37) : sub;

        html += `<g class="dag-node" data-node-id="${node.id}" transform="translate(${pos.x}, ${pos.y})">
          <rect class="node-box" width="${NODE_W}" height="${NODE_H}" rx="9"
            fill="${active ? '#1b2336' : '#121723'}"
            stroke="${active ? '#eab044' : 'rgba(255,255,255,0.14)'}"
            stroke-width="${active ? '2.2' : '1.1'}" />
          <rect x="0" y="11" width="4" height="${NODE_H - 22}" rx="2" fill="${color}" />
          <text x="14" y="25" fill="#f1f5f9" font-size="12.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">${title}</text>
          <text x="14" y="45" fill="#828fa8" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">${subShort}</text>
        </g>`;
      }

      viewportG.innerHTML = html;

      viewportG.querySelectorAll(".dag-node").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          selectedNodeId = el.getAttribute("data-node-id");
          renderScenario(false);
          updateInspector();
        });
      });

      if (shouldFit) fitToViewport(layout);
      updateInspector();
    }

    function renderScenarioTabs() {
      const container = document.getElementById("scenario-tabs");
      container.innerHTML = SCENARIOS.map(s =>
        `<button type="button" class="tab-btn ${s.id === currentScenario.id ? 'active' : ''}" data-sid="${s.id}">${s.title}</button>`
      ).join("");
      container.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentScenario = SCENARIOS.find(s => s.id === btn.getAttribute("data-sid"));
          selectedNodeId = currentScenario.nodes[0].id;
          renderScenarioTabs();
          renderScenario(true);
        });
      });
    }

    function renderLegend() {
      document.getElementById("legend-bar").innerHTML = Object.values(GROUPS)
        .map(g => `<span><i style="background:${g.color}"></i>${g.label}</span>`)
        .join("");
    }

    // ===================== 平移与滚轮缩放 =====================
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    svgEl.addEventListener("mousedown", (e) => {
      if (e.target.closest(".dag-node")) return;
      isDragging = true;
      startX = e.clientX - panX;
      startY = e.clientY - panY;
      svgEl.classList.add("dragging");
    });
    window.addEventListener("mousemove", (e) => {
      if (!isDragging) return;
      panX = e.clientX - startX;
      panY = e.clientY - startY;
      applyTransform();
    });
    window.addEventListener("mouseup", () => {
      isDragging = false;
      svgEl.classList.remove("dragging");
    });
    svgEl.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.1 : 0.9;
      const nextZoom = Math.max(0.35, Math.min(2.4, zoom * factor));
      const rect = svgEl.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const my = e.clientY - rect.top;
      panX = mx - ((mx - panX) / zoom) * nextZoom;
      panY = my - ((my - panY) / zoom) * nextZoom;
      zoom = nextZoom;
      applyTransform();
    }, { passive: false });

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      zoom = Math.min(2.4, zoom * 1.18);
      applyTransform();
    });
    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      zoom = Math.max(0.35, zoom / 1.18);
      applyTransform();
    });
    document.getElementById("btn-fit").addEventListener("click", () => {
      fitToViewport(layoutDAG(currentScenario));
    });
    document.getElementById("btn-expand").addEventListener("click", (e) => {
      const wrap = document.getElementById("stage-wrap");
      const expanded = wrap.classList.toggle("is-expanded");
      e.currentTarget.textContent = expanded ? "退出全屏" : "全屏画布";
      setTimeout(() => fitToViewport(layoutDAG(currentScenario)), 50);
    });

    // ===================== 函数字典渲染 =====================
    function renderGroupTabs() {
      const container = document.getElementById("group-tabs");
      const allBtn = `<button type="button" class="tab-btn ${currentGroupFilter === 'all' ? 'active' : ''}" data-grp="all">全部模块 (${ALL_FUNCTIONS.length})</button>`;
      const modBtns = Object.entries(GROUPS).map(([k, v]) => {
        const cnt = ALL_FUNCTIONS.filter(f => f.group === k).length;
        return `<button type="button" class="tab-btn ${currentGroupFilter === k ? 'active' : ''}" data-grp="${k}">${v.label} (${cnt})</button>`;
      }).join("");
      container.innerHTML = allBtn + modBtns;
      container.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentGroupFilter = btn.getAttribute("data-grp");
          renderGroupTabs();
          renderTable();
        });
      });
    }

    function renderTable() {
      const q = document.getElementById("dict-search").value.trim().toLowerCase();
      const rows = ALL_FUNCTIONS.filter(item => {
        if (currentGroupFilter !== "all" && item.group !== currentGroupFilter) return false;
        if (!q) return true;
        return (
          item.fn.toLowerCase().includes(q) ||
          item.file.toLowerCase().includes(q) ||
          item.lesson.toLowerCase().includes(q) ||
          item.role.toLowerCase().includes(q) ||
          item.callers.some(c => c.toLowerCase().includes(q)) ||
          item.callees.some(c => c.toLowerCase().includes(q))
        );
      });

      document.getElementById("dict-tbody").innerHTML = rows.map(item => {
        const g = GROUPS[item.group];
        return `<tr>
          <td><span class="mod-badge"><i style="background:${g.color}"></i>${g.label}</span></td>
          <td>
            <span class="fn-name">${item.fn}</span>
            <span class="fn-file">${item.file}:${item.line}</span>
          </td>
          <td style="font-family:var(--mono);color:var(--text-sec);white-space:nowrap">${item.lesson}</td>
          <td>${item.role}</td>
          <td style="color:var(--text-sec)">
            <div><strong style="color:var(--text)">入：</strong>${item.callers.join(" / ") || "—"}</div>
            <div style="color:var(--muted)"><strong style="color:var(--text-sec)">出：</strong>${item.callees.join(" → ") || "叶节点"}</div>
          </td>
          <td><a class="jump-link" href="${cursorLink(item.file, item.line)}">定位源码</a></td>
        </tr>`;
      }).join("");
    }

    document.getElementById("dict-search").addEventListener("input", renderTable);
    document.getElementById("stat-flows").textContent = String(SCENARIOS.length);
    document.getElementById("stat-fns").textContent = String(ALL_FUNCTIONS.length);

    renderLegend();
    renderScenarioTabs();
    renderGroupTabs();
    renderTable();
    requestAnimationFrame(() => renderScenario(true));
  </script>
</body>
</html>
